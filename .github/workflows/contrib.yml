name: contrib
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/contrib.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTRIB_TOKEN: ${{ secrets.CONTRIB_TOKEN }}
      - run: |
          mkdir out && mv contrib.svg out/
          cd out
          git init -q -b output
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add contrib.svg
          git commit -qm "contrib"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
